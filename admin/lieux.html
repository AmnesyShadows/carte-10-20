<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1"
    >

    <title>SASP Nord — Administration — Lieux</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body id="filigrane">

<header>

    <a href="../index.html" class="admin-brand">
        <strong>SASP Nord</strong>
        <span>Administration — Lieux</span>
    </a>

    <strong id="admin-logged" class="admin-title hidden">
        🔒 Administrateur
    </strong>

    <div>
    
        <button
            id="logout"
            class="danger hidden"
            type="button"
        >
            Déconnexion
        </button>

    </div>

</header>


<!-- =====================================================
     ADMINISTRATION
===================================================== -->

<section
    id="admin"
    class="hidden"
>

    <!-- =================================================
         SIDEBAR
    ================================================== -->

    <aside>

        <div class="section-header">

            <div class="section-title">

                <h2>
                    Lieux
                </h2>

            </div>

            <button
                id="new"
                class="primary"
                type="button"
            >
                + Nouveau lieu
            </button>

        </div>


        <input
            id="search"
            placeholder="Rechercher..."
        >


        <div id="locations-content">

            <div id="list"></div>

        </div>

    </aside>


    <!-- =================================================
         CONTENU PRINCIPAL
    ================================================== -->

    <main>

        <!-- TITRE -->

        <div class="row">

            <div>

                <h2 id="title">
                    Nouveau lieu
                </h2>

                <p id="status"></p>

            </div>


            <div>

                <button
                    id="delete"
                    class="danger hidden"
                    type="button"
                >
                    Supprimer
                </button>

                <button
                    id="save"
                    class="primary"
                    type="button"
                >
                    Enregistrer
                </button>

            </div>

        </div>


        <!-- FORMULAIRE -->

        <form id="form">

            <!-- NOM -->

            <label>

                Nom

                <input
                    id="name"
                    required
                >

            </label>


            <!-- TYPE -->

            <label>

                Type

                <select
                    id="type"
                    required
                ></select>

            </label>


            <!-- X -->

            <label>

                X

                <input
                    id="x"
                    type="number"
                    step="1"
                    required
                >

            </label>


            <!-- Y -->

            <label>

                Y

                <input
                    id="y"
                    type="number"
                    step="1"
                    required
                >

            </label>


            <!-- DESCRIPTION -->

            <label class="full">

                Description

                <textarea
                    id="description"
                    rows="4"
                ></textarea>

            </label>


            <!-- VISIBILITÉ -->

            <label class="check full">

                <input
                    id="visible"
                    type="checkbox"
                    checked
                >

                Visible sur la carte

            </label>


            <!-- CARTE -->

            <div class="full">

                <div id="map"></div>

            </div>


            <!-- IMAGES -->

            <div
                id="images-field"
                class="full"
            >

                <div class="row">

                    <h3>
                        Images
                    </h3>

                    <label class="upload">

                        + Ajouter des images

                        <input
                            id="files"
                            type="file"
                            accept="image/*"
                            multiple
                            hidden
                        >

                    </label>

                </div>


                <div id="images"></div>

            </div>

        </form>

    </main>

</section>


<!-- =====================================================
     SCRIPTS
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="../js/login.js"></script>
<script src="js/lieux.js"></script>

</body>

</html>
